plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace = 'com.kuet.clubhub'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId = 'com.kuet.clubhub'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '0.6.0-week6'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    // UI
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.work:work-runtime:2.10.0'

    // Room (local cache)
    def room_version = '2.8.4'
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // QR codes: ZXing draws them, CameraX + ML Kit read them (the ML Kit model is bundled, so it works offline)
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    def camerax_version = '1.4.1'
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "androidx.camera:camera-mlkit-vision:$camerax_version"

    // Firebase (versions come from the BoM)
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Local unit tests (the team matcher)
    testImplementation 'junit:junit:4.13.2'
}
